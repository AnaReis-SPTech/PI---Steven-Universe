<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Steven Verse | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="shortcut icon" href="./assets/icon/favicon-light.ico" type="image/x-icon"
    media="(prefers-color-scheme: light)">
  <link rel="shortcut icon" href="./assets/icon/favicon-dark.ico" type="image/x-icon"
    media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/gerais.css">
</head>

<body id="cadastro">
  <header>
    <a href="index.html">
      << /a>
  </header>
  <div class="container">

    <!-- Alertas do Web-Data-Viz -->
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <!-- Fim alertas do Web-Data-Viz -->

    <main>
      <div>
        <h1>Cadastre-se</h1>
      </div>
      <div class="box-inputs">
        <div class="campos">
          <div>
            <label for="ipt_nome_completo">Nome Completo: </label>
            <input type="text" id="ipt_nome_completo">
          </div>
          <div>
            <label for="ipt_nome_usuario">Nome de Usuário: </label>
            <input type="text" id="ipt_nome_usuario">
          </div>
          <div>
            <label for="ipt_dt_nasc">Data de Nascimento: </label>
            <input type="date" id="ipt_dt_nasc">
          </div>
        </div>
        <div class="campos">
          <div>
            <label for="ipt_email">E-mail: </label>
            <input type="text" id="ipt_email">
          </div>
          <div>
            <label for="ipt_senha">Senha: </label>
            <input type="password" id="ipt_senha">
          </div>
          <div>
            <label for="ipt_conf_senha">Confirmar senha: </label>
            <input type="password" id="ipt_conf_senha">
          </div>
        </div>
      </div>
      <div class="box-buttons">
        <button class="principal-cad" onclick="cadastrar()">Cadastrar</button>
        <a class="secundario-cad" href="login.html">Já tenho login</a>
      </div>
    </main>
  </div>
</body>

</html>

<script>

  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeCompletoVar = ipt_nome_completo.value;
    var nomeVar = ipt_nome_usuario.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var dtNascVar = ipt_dt_nasc.value;
    var confirmacaoSenhaVar = ipt_conf_senha.value;

    // Verificando se há algum campo em branco
    if (
      nomeCompletoVar == "" ||
      nomeVar == "" ||
      emailVar == "" ||
      dtNascVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeCompletoServer: nomeCompletoVar,
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        dtNascServer: dtNascVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
