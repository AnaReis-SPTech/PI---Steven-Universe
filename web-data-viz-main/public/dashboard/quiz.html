<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="../css/gerais.css">

    <script src="../js/sessao.js"></script>

    <title>Steven Verse | Quiz</title>
</head>


<body onload="receberQuiz(), validarSessao()">

    <div class="voltar">
        <a onclick="history.back()"> < </a>
    </div>

    <main id="main-background" class="bg-color">
        <div class="container" id="container">
            <div id="elemento1" class="container-titulo">
                <h2 class="titulo">quiz</h2>
            </div>
            <div id="elemento2" class="container-content">
                <div class="content-textos">
                    <div class="content-textos-div">
                        <h2 class="titulo" id="id_titulo">Titulo</h2>
                        <p class="descricao" id="id_desc">Descrição</p>
                    </div>
                    <button onclick="iniciarQuiz()" id="botao">iniciar</button>
                </div>
                <div class="imagem"></div>
            </div>
        </div>
    </main>
</body>

</html>
<script>
    let div1 = document.getElementById('elemento1');
    let div2 = document.getElementById('elemento2');
    let container = document.getElementById('container');

    async function receberQuiz() {
        
        // Fetch para receber quiz
        const retornoQuiz = await fetch('../quiz/listarQuiz');
        const retornoQuizConvertido = await retornoQuiz.json();
        const quiz = retornoQuizConvertido;

        // Adiciona o título do quiz
        id_titulo.innerHTML = `${quiz[0].titulo}`;
        id_desc.innerHTML = `${quiz[0].descricao}`;

        return quiz;
    }



    async function receberPerguntas() {

        // Fetch para receber perguntas
        const retornoPerguntas = await fetch('../perguntas/listarPerguntas');
        const retornoPerguntasConvertido = await retornoPerguntas.json();
        const perguntas = retornoPerguntasConvertido;

        return perguntas;
    }



    async function iniciarQuiz() {

        let perguntas = await receberPerguntas();
        let fundo = document.getElementById('main-background');

        fundo.classList.remove('bg-color');

        let div1 = document.getElementById('elemento1');
        let div2 = document.getElementById('elemento2');
        let container = document.getElementById('container');

        div1.classList.remove('container-titulo');
        div1.classList.add('container-p-titulo');

        div1.innerHTML = `
            <h2 class="numero_quest">${perguntas[0].id}</h2>
            <h2 class="titulo">${perguntas[0].pergunta}</h2>
            `;

        container.classList.add('container-alt');

        div2.classList.add('content-alt');

        div2.innerHTML = `
            <div class="botoes_alternativas">        
                <button class="alternativas" onclick="proximaQuestao('alt_1')">${perguntas[0].alt_1}</button>
                <button class="alternativas" onclick="proximaQuestao('alt_2')">${perguntas[0].alt_2}</button>
            </div>
            <div class="botoes_alternativas">         
                <button class="alternativas" onclick="proximaQuestao('alt_3')">${perguntas[0].alt_3}</button>
                <button class="alternativas" onclick="proximaQuestao('alt_4')">${perguntas[0].alt_4}</button>
            </div>
        `;
    }

    let num_alt = 0;
    let qtd_acertos = 0;
    let qtd_erros = 0;

    // Função que exibe as alternativas conforme a resposta do usuário
    async function proximaQuestao(alternativa) {

        let perguntas = await receberPerguntas();

        let div1 = document.getElementById('elemento1');
        let div2 = document.getElementById('elemento2');

        if (alternativa == perguntas[num_alt].alt_correta) {
            qtd_acertos += 1;
            num_alt += 1;
            console.log('Adicionei 1')
        } else {
            qtd_erros += 1;
            num_alt += 1;
            console.log('Tirei 1')
        }

        let erros = qtd_erros;
        let acertos = qtd_acertos;

        // Quando as perguntas acabarem, chama as funções de exibição e envio para o BD
        if (num_alt == perguntas.length) {
            resultadoQuiz(acertos, erros);
            finalizarQuiz(acertos, erros);
            return
        }

        div1.innerHTML = `
        <h2 class="numero_quest">${perguntas[num_alt].id}</h2>
        <h2 class="titulo">${perguntas[num_alt].pergunta}</h2>
        `;

        div2.innerHTML = `
        <div class="botoes_alternativas">        
            <button class="alternativas" onclick="proximaQuestao('alt_1')">${perguntas[num_alt].alt_1}</button>
            <button class="alternativas" onclick="proximaQuestao('alt_2')">${perguntas[num_alt].alt_2}</button>
        </div>
        <div class="botoes_alternativas">         
            <button class="alternativas" onclick="proximaQuestao('alt_3')">${perguntas[num_alt].alt_3}</button>
            <button class="alternativas" onclick="proximaQuestao('alt_4')">${perguntas[num_alt].alt_4}</button>
        </div>
        `;
    }

    // Função que exibe o resultado do quiz
    async function resultadoQuiz(acertos, erros) {

        let nome = sessionStorage.NOME_USUARIO;
        let perguntas = await receberPerguntas();
        let porcentagem = (acertos * 100) / perguntas.length;

        container.classList.add('container-resultados');

        let classeCor = '';
        let gifResultado = '';
        let fraseFinal = '';

        if (porcentagem >= 70) {
            fraseFinal = `Pérola ficaria orgulhosa de você <span>${nome}</span>! Continue assim, seu resultado é fruto do seu esforço.`;
            classeCor = 'resultado-positivo';
            gifResultado = 'positivo';
        } else if (porcentagem >= 50) {
            fraseFinal = `Seu resultado foi mediano. Mas continue tentando e nunca desista de melhorar <span>${nome}</span>!`;
            gifResultado = 'comum';
            classeCor = 'resultado-comum';
        } else {
            fraseFinal = `Tudo bem errar, os erros lhe mostram que existe espaço pra melhorar, continue tentando <span>${nome}</span>!`;
            gifResultado = 'negativo';
            classeCor = 'resultado-negativo';
        }

        container.innerHTML = `
        <div class="container-gif">
                <div class="gif url-imagem-${gifResultado}"></div>
            </div>
            <div class="content-resultados">
                <h2 class="resultados-titulo">${fraseFinal}</h2>
                <div class="resultados-cards">
                    <div class="card card-erros">
                        <h3>erros</h3>
                        <div class="resultados-imagem ametista"></div>
                        <p>Os erros podem ser difíceis de aceitar, mas para evoluir é preciso aceitar seus ‘defeitos’.</p>
                    </div>
                    <div class="card-central">
                        <div id="id_acertos" class="resultados">${acertos}</div>
                        <div id="id_porcentagem" class="${classeCor}">${porcentagem}%</div>
                        <div id="id_erros" class="resultados">${erros}</div>
                    </div>
                    <div class="card card-acertos">
                        <h3>acertos</h3>
                        <div class="resultados-imagem perola"></div>
                        <p>Parabéns, seus acertos são o símbolo do seu esforço. Pode descansar agora.</p>
                    </div>
                </div>
            </div>
        `;

        let main = document.getElementById('main-background');

        main.innerHTML += `<a class="btn-continuar" href='./dashboard.html'>Continuar</a>`

        if (porcentagem >= 70) {
            let acertos = document.getElementById('id_acertos');
            acertos.classList.add('classe-destaque');
        } else if (porcentagem < 50) {
            let erros = document.getElementById('id_erros');
            erros.classList.add('classe-destaque');
        }
    }

    // Envia o resultado do usuário para o BD
    async function finalizarQuiz(acertos, erros) {
        let id_usuario = sessionStorage.ID_USUARIO;

        let retornoQuiz = await fetch('../quiz/listarQuiz');
        let retornoQuizConvertido = retornoQuiz.json();
        let quiz = await retornoQuizConvertido;

        let id_quiz = quiz[0].id_quiz;

        fetch("/usuario_quiz/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                acertosServer: acertos,
                errosServer: erros,
                usuarioServer: id_usuario,
                iDquizServer: id_quiz
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    console.log("DEU CERTO!!!");
                } else {
                    throw "DEU ERRADO =[";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

</script>
