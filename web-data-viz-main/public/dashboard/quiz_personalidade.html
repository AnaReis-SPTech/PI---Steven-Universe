<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="../css/gerais.css">

    <script src="../js/sessao.js"></script>

    <title>Steven Verse | Quiz</title>
</head>


<body onload="receberQuiz(), validarSessao()">

    <div class="voltar">
        <a onclick="history.back()"><</a>
    </div>

    <main id="main-background" class="bg-color">

        <div class="container" id="container">
            <div id="elemento1" class="container-titulo">
                <h2 class="titulo">quiz</h2>
            </div>
            <div id="elemento2" class="container-content">
                <div class="content-textos">
                    <div class="content-textos-div">
                        <h2 class="titulo" id="id_titulo">Titulo</h2>
                        <p class="descricao" id="id_desc">Descrição</p>
                    </div>
                    <button onclick="iniciarQuiz()" id="botao">iniciar</button>
                </div>
                <div class="imagem"></div>
            </div>
        </div>

    </main>
</body>

</html>
<script>
    // Variáveis feitas para manipular o html
    let div1 = document.getElementById('elemento1');
    let div2 = document.getElementById('elemento2');
    let container = document.getElementById('container');

    // Função que recebe o quiz do banco de dados
    async function receberQuiz() {
        // Código para receber quiz
        const retornoQuiz = await fetch('../quiz/listarQuiz');
        const retornoQuizConvertido = await retornoQuiz.json();
        const quiz = retornoQuizConvertido;

        console.log("Retorno Quiz: ", retornoQuizConvertido);

        id_titulo.innerHTML = `${quiz[1].titulo}`;

        id_desc.innerHTML = `${quiz[1].descricao}`;
    }

    // Função que recebe as perguntas do banco de dados
    async function receberPerguntas() {

        // Código para receber perguntas
        const retornoPerguntas = await fetch('../perguntasP/listarPerguntas');
        const retornoPerguntasConvertido = await retornoPerguntas.json();
        const perguntas = retornoPerguntasConvertido;

        console.log("Retorno Peguntas: ", retornoPerguntasConvertido);

        return perguntas;
    }


    // Função que inicia o quiz
    async function iniciarQuiz() {

        let perguntas = await receberPerguntas();

        let fundo = document.getElementById('main-background');

        // Faz o fundo ficar branco
        fundo.classList.remove('bg-color');

        // Pega os elementos pela classe
        let div1 = document.getElementById('elemento1');
        let div2 = document.getElementById('elemento2');
        let container = document.getElementById('container');

        // Faz o container se ajustar ao desaign das perguntas
        div1.classList.remove('container-titulo');
        div1.classList.add('container-p-titulo');

        // Título e número da 1° questão
        div1.innerHTML = `
            <h2 class="numero_quest">${num_alt + 1}</h2>
            <h2 class="titulo">${perguntas[0].pergunta}</h2>
            `;

        container.classList.add('container-alt');

        div2.classList.add('content-alt');

        // Printa as alternativas
        div2.innerHTML = `
            <div class="botoes_alternativas">        
                <button class="alternativas" onclick="proximaQuestao('coracao')">${perguntas[0].alt_1}</button>
                <button class="alternativas" onclick="proximaQuestao('mente')">${perguntas[0].alt_2}</button>
            </div>
            <div class="botoes_alternativas">         
                <button class="alternativas" onclick="proximaQuestao('vontade')">${perguntas[0].alt_3}</button>
                <button class="alternativas" onclick="proximaQuestao('espirito')">${perguntas[1 + 0].alt_4}</button>
            </div>
        `;
    }

    // Variável que controla o número da alternativa
    let num_alt = 0;

    // Variáveis dos atributos do quiz
    let coracao = 0;
    let mente = 0;
    let vontade = 0;
    let espirito = 0;
    let personagem = '';

    // Função que continua as questões
    async function proximaQuestao(alternativa) {

        let perguntas = await receberPerguntas();
        console.log("Número da Alternativa: ", num_alt + 1);

        let div1 = document.getElementById('elemento1');
        let div2 = document.getElementById('elemento2');

        // Pontua os atributos de acordo com a resposta da questão
        if (alternativa == 'coracao') {
            coracao++
            console.log('+coracao')
            num_alt++

        } else if (alternativa == 'mente') {
            mente++
            console.log('+mente')
            num_alt++
        } else if (alternativa == 'vontade') {
            vontade++
            console.log('+vontade')
            num_alt++

        } else if (alternativa == 'espirito') {
            espirito++
            console.log('+espirito')
            num_alt++

        }

        // Verifica se chegou na última pergunta, se sim ativa a função finalizarQuiz()
        if (num_alt == perguntas.length) {

            if ((coracao * 3) > (mente + vontade + espirito) && (mente * 2) > (espirito + vontade)) {
                // Connie
                console.log('SEU RESULTADO É CONNIE');
                personagem = 'connie';
                mensagem_personagem = 'O equilíbrio entre a emoção e a sabedoria, além de ser totalmente leal!';

            } else if ((coracao * 3) > (mente + vontade + espirito)) {
                // Steven
                console.log('SEU RESULTADO É STEVEN');
                personagem = 'steven';
                mensagem_personagem = 'Coração mole e extremamente empático, o mediador da maioria dos conflitos!';

            } else if ((mente * 3) > (coracao + vontade + espirito) && (espirito * 2) > (coracao + vontade)) {
                // Peridot
                console.log('SEU RESULTADO É PERIDOT');
                personagem = 'peridot';
                mensagem_personagem = 'Disvertida, livre e pragmática, entender seus sentimentos pode ser difícil, mas você consegue!';

            } else if ((mente * 3) > (coracao + vontade + espirito)) {
                // Pérola
                console.log('SEU RESULTADO É PÉROLA');
                personagem = 'perola';
                mensagem_personagem = 'Extremamente perspicaz e metódica, você pode até tentar ser perfeito, mas lembre-se de ser você!';

            } else if ((espirito * 3) > (coracao + vontade + mente) && (vontade * 2) > (coracao + mente)) {
                // Lápis Lazule
                console.log('SEU RESULTADO É LÁPIS');
                personagem = 'lapis';
                mensagem_personagem = 'Já sofreu muito e ficou fria, é por isso que a liberdade e sua intuição é o que move!';

            } else if ((espirito * 3) > (coracao + vontade + mente)) {
                // Ametista
                console.log('SEU RESULTADO É AMETISTA');
                personagem = 'ametista';
                mensagem_personagem = 'Pode ser difícil se aceitar em um mundo repleto de falsos perfeitos, mas sua perfeição vem de dentro!';

            } else if ((vontade * 3) > (coracao + espirito + mente)) {
                // Garnet
                console.log('SEU RESULTADO É GARNET');
                personagem = 'garnet';
                mensagem_personagem = 'Você é forte, tem vontade e sua intuição nunca falha!';

            }

            resultadoQuiz(coracao, mente, vontade, espirito, personagem);
            finalizarQuiz(coracao, mente, vontade, espirito, personagem);
            return
        }

        div1.innerHTML = `
        <h2 class="numero_quest">${num_alt + 1}</h2>
        <h2 class="titulo">${perguntas[num_alt].pergunta}</h2>
        `;

        // Printa as alternativas de acordo com o número da questão
        div2.innerHTML = `
        <div class="botoes_alternativas">        
            <button class="alternativas" onclick="proximaQuestao('coracao')">${perguntas[num_alt].alt_1}</button>
            <button class="alternativas" onclick="proximaQuestao('mente')">${perguntas[num_alt].alt_2}</button>
        </div>
        <div class="botoes_alternativas">         
            <button class="alternativas" onclick="proximaQuestao('vontade')">${perguntas[num_alt].alt_3}</button>
            <button class="alternativas" onclick="proximaQuestao('espirito')">${perguntas[num_alt].alt_4}</button>
        </div>
        `;
    }

    // Função que mostra a tela de resultados
    async function resultadoQuiz(coracao, mente, vontade, espirito, personagem) {
        console.log("QTD Coracao: ", coracao);
        console.log("QTD Mente: ", mente);
        console.log("QTD Vontade: ", vontade);
        console.log("QTD Espirito: ", espirito);
        console.log("PERSONAGEM: ", personagem);

        let nome = sessionStorage.NOME_USUARIO;

        let perguntas = await receberPerguntas();

        container.classList.add('container-resultados');

        container.classList.remove('container-alt');
        let fundo = document.getElementById('main-background');

        // Exibe os resultados
        fundo.innerHTML = `
        <div class="container container-resultados" id="container">

            <div class="container-gif">
                <div class="gif url-imagem-${personagem}"></div>
            </div>

            <div class="content-texto-personalidade">

                <h3>Seu personagem é</h3>
                <h1>${personagem}</h1>
                <p>${mensagem_personagem}</p>

            </div>

            <div class="content-resultados-personalidade cor-${personagem}">

                <div class="atributo-imagem">
                    <div class="resultado-personalidade">
        
                        <div class="atributos">
                            <h3>Coração</h3>
                            <h3>Mente</h3>
                            <h3>Vontade</h3>
                            <h3>Espírito</h3>
                        </div>
                        <div class="atributos right">
                            <h4>${coracao}</h4>
                            <h4>${mente}</h4>
                            <h4>${vontade}</h4>
                            <h4>${espirito}</h4>
                        </div>
                    </div>
        
                    <div class="imagem-personagem ${personagem}"></div>
                </div>

                <button onclick="location.reload()"> Refazer teste </button>

            </div>
        </div>
        `;

        let main = document.getElementById('main-background');


        main.innerHTML += `<a href="./dashboard.html" class="btn-continuar")">Continuar</a>`

    }

    // Função que envia os dados finais ao banco de dados
    async function finalizarQuiz(coracao, mente, vontade, espirito, personagem) {

        let id_usuario = sessionStorage.ID_USUARIO;
        console.log("Id do Usuário: ", id_usuario);

        let retornoQuiz = await fetch('../quiz/listarQuiz');
        let retornoQuizConvertido = retornoQuiz.json();
        let quiz = await retornoQuizConvertido;

        let id_quiz = quiz[1].id_quiz;

        fetch("/usuario_quizP/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                iDquizServer: id_quiz,
                usuarioServer: id_usuario,
                coracaoServer: coracao,
                menteServer: mente,
                vontadeServer: vontade,
                espiritoServer: espirito,
                personagemServer: personagem
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    console.log("DEU CERTO!!!");
                } else {
                    throw "DEU ERRADO =[";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

</script>
