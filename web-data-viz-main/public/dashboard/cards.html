<script>
    var idUsuario = sessionStorage.ID_USUARIO;

    async function receberMaiorAtributo() {
        // Código para receber maior atributo do usuário
        // var idUsuario = sessionStorage.ID_USUARIO;
        const retornoMaiorAtributo = await fetch(`/resultQuiz/listarMaiorAtributo/${idUsuario}`);
        const retornoMaiorAtributoConvertido = await retornoMaiorAtributo.json();
        const MaiorAtributo = retornoMaiorAtributoConvertido;

        console.log("Retorno MaiorAtributo: ", MaiorAtributo);

        mostrarAtributos(MaiorAtributo);

    }

    function mostrarAtributos(MaiorAtributo) {

        if (MaiorAtributo.length == 0) {
            id_atributos.innerHTML = `Faça o quiz de personalidade para receber atributos e saber seu personagem!`;
            return
        }

        let coracao = parseInt(MaiorAtributo[0].qtd_coracao);
        let mente = parseInt(MaiorAtributo[0].qtd_mente);
        let vontade = parseInt(MaiorAtributo[0].qtd_vontade);
        let espirito = parseInt(MaiorAtributo[0].qtd_espirito);

        let imagemPersonagem = document.getElementById('img_personagem');

        id_atributos.innerHTML = `
            <div class="atributo">
                <h3>Coracao</h3>
                <p id="id_coracao">10</p>
            </div>
            <div class="atributo">
                <h3>Mente</h3>
                <p id="id_mente">7</p>
            </div>
            <div class="atributo">
                <h3>Vontade</h3>
                <p id="id_vontade">5</p>
            </div>
            <div class="atributo">
                <h3>Espirito</h3>
                <p id="id_espirito">7</p>
            </div>
        `;

        id_coracao.innerHTML = `${coracao}`;
        id_mente.innerHTML = `${mente}`;
        id_vontade.innerHTML = `${vontade}`;
        id_espirito.innerHTML = `${espirito}`;

        let personagem = '';

        if ((coracao * 3) >= (mente + vontade + espirito) && (mente * 2) > (espirito + vontade)) {
            // Connie
            personagem = 'connie';

        } else if ((coracao * 3) >= (mente + vontade + espirito)) {
            // Steven
            personagem = 'steven';

        } else if ((mente * 3) >= (coracao + vontade + espirito) && (espirito * 2) > (coracao + vontade)) {
            // Peridot
            personagem = 'peridot';

        } else if ((mente * 3) >= (coracao + vontade + espirito)) {
            // Pérola
            personagem = 'perola';

        } else if ((espirito * 3) >= (coracao + vontade + mente) && (vontade * 2) > (coracao + mente)) {
            // Lápis Lazule
            personagem = 'lapis';

        } else if ((espirito * 3) >= (coracao + vontade + mente)) {
            // Ametista
            personagem = 'ametista';

        } else if ((vontade * 3) >= (coracao + espirito + mente)) {
            // Garnet
            personagem = 'garnet';

        }

        imagemPersonagem.classList.add(`${personagem}`);
    }
</script>
