<!-- Carrega as informações necessárias no body -->

            <div class="itens-nav">

                    <a href="cards.html">

                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./dashboard.html">
                        <img src="../assets/icon/dashboard.svg" alt="">
                        <h3 class="textos-nav esconder">Dashboard</h3>
                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./escolher_quizes.html">

                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./mural.html">

                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">

                        <h3 class="textos-nav esconder">Sorteador</h3>

                <img src="./../assets/icon/sair.svg" alt="">

        <div class="container-dashboard">

                <p>Veja seus dados a partir da</p>

                <div class="box-trivia">

                    <div class="box-trivia-ranking">

                        <div class="div-ranking"> <!-- colunm -->
                            <div class="ranking-titulo"> <!-- row -->
                                <p>usuário</p>
                                <p>posição</p>
                                <p>média</p>
                            </div>

                        </div>

                <div class="box-personalidade" id="box_personalidade">
                    <h2>Personalidade</h2>
                    <div class="box-kpis">
                        <div class="kpi kpi-atributo" id="kpi_atributo">
                        </div>

<!-- Tráz o script do menu hamburguer -->
<script src="../js/menu_hamburguer.js"></script>

<script>

    var idUsuario = sessionStorage.ID_USUARIO;

    async function receberMaiorAtributo() {
        // Código para receber maior atributo do usuário
        const retornoMaiorAtributo = await fetch(`/resultQuiz/listarMaiorAtributo/${idUsuario}`);
        const retornoMaiorAtributoConvertido = await retornoMaiorAtributo.json();
        const MaiorAtributo = retornoMaiorAtributoConvertido;

        KPImaiorAtributo(MaiorAtributo);

    }

    async function receberMaiorPersonagem() {
        // Código para receber o personagem mais caído
        const retornoMaiorPersonagem = await fetch(`/resultQuiz/listarMaiorPersonagem/${idUsuario}`);
        const retornoMaiorPersonagemConvertido = await retornoMaiorPersonagem.json();
        const MaiorPersonagem = retornoMaiorPersonagemConvertido;

        KPImaiorPersonagem(MaiorPersonagem);

    }

    async function receberTentativasKPI() {
        // Código para receber quiz
        const retornoUsuarioTentativas = await fetch(`/resultQuiz/listarUsuarioTentativas/${idUsuario}`);
        const retornoUsuarioTentativasConvertido = await retornoUsuarioTentativas.json();
        const UsuarioTentativas = retornoUsuarioTentativasConvertido;

        // Código para receber tentativas do usuário
        const retornoGeralTentativas = await fetch(`/resultQuiz/listarGeralTentativas`);
        const retornoGeralTentativasConvertido = await retornoGeralTentativas.json();
        const GeralTentativas = retornoGeralTentativasConvertido;

        KPItentativas(GeralTentativas, UsuarioTentativas);
    }

    async function receberRanking() {
        // Código para receber quiz
        const retornoRanking = await fetch(`/resultQuiz/listarRanking`);
        const retornoRankingConvertido = await retornoRanking.json();
        const Ranking = retornoRankingConvertido;

        gerarRanking(Ranking);

    }

    async function receberGrafico() {
        // Código para receber atributos
        const retornoGraficoGerais = await fetch(`/resultQuiz/listarGraficoGerais`);
        const retornoGraficoGeraisConvertido = await retornoGraficoGerais.json();
        const GraficoGerais = retornoGraficoGeraisConvertido;

        // Código para receber as informações do gráfico
        let idUsuario = sessionStorage.ID_USUARIO;
        const retornoGraficoUsuario = await fetch(`/resultQuiz/listarGraficoUsuario/${idUsuario}`);
        const retornoGraficoUsuarioConvertido = await retornoGraficoUsuario.json();
        const GraficoUsuario = retornoGraficoUsuarioConvertido;

        gerarGrafico(GraficoGerais, GraficoUsuario);
    }

    function gerarGrafico(GraficoGerais, GraficoUsuario) {
        // Função que gera o gráfico de atributos

        const grafico = document.getElementById('graficoBarras');

        new Chart(grafico, {
            type: 'bar',
            data: {
                labels: ['Coração', 'Mente', 'Vontade', 'Espirito'],
                datasets: [{
                    label: 'Geral',
                    data: [GraficoGerais[0].qtd_coracao, GraficoGerais[0].qtd_mente, GraficoGerais[0].qtd_vontade, GraficoGerais[0].qtd_espirito],
                    backgroundColor: 'black',
                    borderWidth: 1
                }, {
                    label: 'Você',
                    data: [GraficoUsuario[0].qtd_coracao, GraficoUsuario[0].qtd_mente, GraficoUsuario[0].qtd_vontade, GraficoUsuario[0].qtd_espirito],
                    backgroundColor: '#0F75BC',
                    borderWidth: 1
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0,
                        max: 10
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Média de atributos',
                        font: {
                            family: 'Gluten, cursive',
                            size: 24,
                            weigth: 600
                        },
                        color: 'black'
                    }
                }
            }
        });
        
    }

    function gerarRanking(ranking) {
        // Função que gera o ranking de usuários

        let idUsuario = sessionStorage.ID_USUARIO;

        for (let i = 0; i < ranking.length; i++) {

            if (ranking[i].id == idUsuario) {
                // If que destaca a linha com as informações do usuário atual
                id_ranking.innerHTML += `
                    <div class="pessoa usuario-ranking">
                        <p>${ranking[i].nome_usuario}</p>
                        <p>${i+1}°</p>
                        <p>${ranking[i].m_acertos}</p>
                    </div>
                `;

            } else {

                id_ranking.innerHTML += `
                    <div class="pessoa">
                        <p>${ranking[i].nome_usuario}</p>
                        <p>${i+1}°</p>
                        <p>${ranking[i].m_acertos}</p>
                    </div>
                `;

            }

        }

    }

    function KPImaiorAtributo(MaiorAtributo) {
        // Função que exibe na tela a KPI com o maior atributo do usuário
        if (MaiorAtributo.length == 0) {
            kpi_atributo.innerHTML = `Faça o quiz de personalidade para desbloquear essa KPI.`;
        }

        let coracao = MaiorAtributo[0].qtd_coracao;
        let mente = MaiorAtributo[0].qtd_mente;
        let vontade = MaiorAtributo[0].qtd_vontade;
        let espirito = MaiorAtributo[0].qtd_espirito;

        let atributos = [
            {
                'nome': 'coracao',
                'valor': `${coracao}`
            },
            {
                'nome': 'mente',
                'valor': `${mente}`
            },
            {
                'nome': vontade,
                'valor': `${vontade}`
            },
            {
                'nome': 'espirito',
                'valor': `${espirito}`
            }
        ];

        let maiorAtributo = atributos[0];

        for (let i = 0; i < atributos.length; i++) {
            
            if (atributos[i].valor > maiorAtributo) {
                maiorAtributo = atributos[i];
            }
            
        }

        kpi_atributo.innerHTML = `
                <h2>Seu maior atributo</h2>
                <h1>${maiorAtributo.nome}</h1>
                <p>A pontuação total foi ${maiorAtributo.valor}</p>
        `;


    }

    function KPImaiorPersonagem(MaiorPersonagem) {
        // Função que exibe na tela o personagem que o usuário mais tirou no quiz de personalidade
        if (MaiorPersonagem.length == 0) {
            kpi_personagem.innerHTML = `Faça o quiz de personalidade para desbloquear essa KPI.`;
        }

        let vezes = '';

        if (MaiorPersonagem[0].contagem == 1) {
            vezes = `${MaiorPersonagem[0].contagem} vez`;
        } else {
            vezes = `${MaiorPersonagem[0].contagem} vezes`;
        }
        
        kpi_personagem.innerHTML = `
            <h2>Personagem mais sorteado</h2>
            <h1>${MaiorPersonagem[0].personagem}</h1>
            <p>Foi seu resultado ${vezes}</p>
        
        `;

    }

    function KPItentativas(GeralTentativas, UsuarioTentativas) {
        // Função que exibe as métricas da quantidade de tentativas do usuário em relação aos outros
        if (UsuarioTentativas.length == 0) {
            kpi_tentativas.innerHTML = `Faça o quiz de personalidade para desbloquear essa KPI.`;
        }

        let tentativasUser = UsuarioTentativas[0].UserTentativas;
        let mediaGeral = GeralTentativas[0].media_todos;        

        let porcentagem = '#ERRO';
        let msgPercent = '';

        // Cálculo da porcentagem a partir da fórmula da diferença
        porcentagem = ((tentativasUser - mediaGeral) / mediaGeral) * 100;


        // Cria a mensagem de exibição
        if (porcentagem < 0) {

            porcentagem = porcentagem * -1;
            msgPercent = `${porcentagem.toFixed(0)}% menor que a dos outros.`;

        } else if (porcentagem == 0) {

            msgPercent = `Igual a dos outros.`;

        } else {

            msgPercent = `${porcentagem.toFixed(0)}% maior que a dos outros.`;

        }
        
        // Exibe a porcentagem e a quantidade de tentativas na tela
        kpi_tentativas.innerHTML = `
            <h2>qtd de tentativas</h2>
            <h1>${tentativasUser}</h1>
            <p>${msgPercent}</p>
        `;


    }

</script>

</html>
