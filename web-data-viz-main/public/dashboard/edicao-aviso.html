<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTech | Página Inicial</title>

    <link rel="stylesheet" href="./../css/menu-hamburguer.css"/>
    <script src="../js/sessao.js"></script>
    
</head>

<body onload="validarSessao()">

    <div class="janela">

        <div class="header-left dash-header" id="header">

            <div class="menu" onclick="abrirMenu()">
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
            </div>

            <div class="itens-nav">
                <div class="btn-nav">
                    <a href="cards.html">
                        <img src="../assets/icon/inicio.svg" alt="">
                        <h3 class="textos-nav esconder">Início</h3>
                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./dashboard.html">
                        <img src="../assets/icon/dashboard.svg" alt="">
                        <h3 class="textos-nav esconder">Dashboard</h3>
                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./escolher_quizes.html">
                        <img src="../assets/icon/quiz.svg" alt="">
                        <h3 class="textos-nav esconder">Quiz</h3>
                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./mural.html">
                        <img src="../assets/icon/forum.svg" alt="">
                        <h3 class="textos-nav esconder">Fórum</h3>
                    </a>
                </div>
                <div class="separacao-itens"></div>
                <div class="btn-nav">
                    <a href="./sorteador.html">
                        <img src="../assets/icon/musicas.svg" alt="">
                        <h3 class="textos-nav esconder">Sorteador</h3>
                    </a>
                </div>
            </div>


            <div class="btn-logout" onclick="limparSessao()">
                <img src="./../assets/icon/sair.svg" alt="">
            </div>

        </div>

        <div class="dash-right">

            <div class="avisos">
                <div class="container">
                    <h1>Editar um aviso</h1>
                    <div class="div-form">
                        <label>
                            ID:
                            <br>
                            <input id="input_id" maxlength="100" type="text" style="color: rgb(196, 196, 196)" disabled>
                        </label>
                        <label>
                            Autor:
                            <br>
                            <input id="input_nome" maxlength="100" type="text" style="color: rgb(196, 196, 196)"
                                disabled>
                        </label>
                        <label>
                            Título:
                            <br>
                            <input id="input_titulo" maxlength="100" type="text" style="color: rgb(196, 196, 196)"
                                disabled>
                        </label>
                        <br>
                        <label>
                            Descrição (máximo de 250 caracteres):
                            <br>
                            <textarea id="textarea_mensagem" maxlength="250" rows="5"></textarea>
                        </label>
                        <br>
                        <button onclick="editar()">Editar</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script src="../js/menu_hamburguer.js"></script>
<script>

    function editar() {
        fetch(`/avisos/editar/${sessionStorage.getItem("ID_POSTAGEM_EDITANDO")}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                msgforum: textarea_mensagem.value
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                window.alert("Post atualizado com sucesso pelo usuario de email: " + sessionStorage.getItem("EMAIL_USUARIO") + "!");
                window.location = "/dashboard/mural.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }

</script>
