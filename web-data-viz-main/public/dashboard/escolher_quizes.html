            <div class="separacao-itens"></div>
            <div class="btn-nav">
                <a href="./dashboard.html">

            </div>
            <div class="separacao-itens"></div>

<script>

    async function receberQuiz() {
        
        // Código para receber quiz
        const retornoQuiz = await fetch('../quiz/listarQuiz');
        const retornoQuizConvertido = await retornoQuiz.json();
        const quiz = retornoQuizConvertido;

        console.log("Retorno Quiz: ", retornoQuizConvertido);

        id_titulo_trivia.innerHTML = `${quiz[0].titulo}`;

        id_desc_trivia.innerHTML = `${quiz[0].descricao}`;

        id_titulo_personalidade.innerHTML = `${quiz[1].titulo}`;

        id_desc_personalidade.innerHTML = `${quiz[1].descricao}`;

        return quiz;
    }

</script>
