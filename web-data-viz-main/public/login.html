<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Steven Verse | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="shortcut icon" href="./assets/icon/favicon-light.ico" type="image/x-icon" media="(prefers-color-scheme: light)">
    <link rel="shortcut icon" href="./assets/icon/favicon-dark.ico" type="image/x-icon" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/gerais.css">
</head>

<body id="login">
    <header>
        <a href="index.html"><</a>
    </header>
    <div class="container">

        <!-- Alertas do Web-Data-Viz -->
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <!-- Fim alertas do Web-Data-Viz -->

        <main id="login-main">
            <div>
                <h1 id="titulo-login">Login</h1>
            </div>
            <div class="box-inputs">
                <div class="campos">
                    <div class="black">
                        <label for="ipt_email">Email: </label>
                        <input type="text" id="ipt_email">
                    </div>
                    <div class="black">
                        <label for="ipt_senha">Senha: </label>
                        <input type="password" id="ipt_senha">
                    </div>
                </div>
            </div>
            <div class="box-buttons">
                <button class="principal-login" onclick="entrar()">Entrar</button>
                <a class="secundario-login" href="cadastro.html">Quero me cadastrar</a>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/loading_steven.gif" id="loading-gif">
                </div>
                <div id="div_erros_login"></div>
            </div>
        </main>
    </div>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Por favor, preencha todo os campos!";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log('oi');
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1500); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                    // if (status(403)) {
                    //     alert('Email ou senha inválidos, tente novamente!');
                    //     finalizarAguardar();
                    // }
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })


        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
